name = "freemail"
main = "src/server.js"
compatibility_date = "2024-01-01"

# 保留 Cloudflare Dashboard 中已经配置好的环境变量和 Secrets
keep_vars = true

# 不启用默认 workers.dev 地址
# 继续使用你现在的自定义域名
workers_dev = false
preview_urls = false


# =========================================================
# D1 数据库
# =========================================================

[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "mail_free_db"
database_id = "edbababc-5f57-434c-a054-4ae8e61ba81c"


# =========================================================
# R2 存储桶
# =========================================================

[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"


# =========================================================
# 静态资源
# =========================================================

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true


# =========================================================
# Workers Logs
# =========================================================

[observability]
enabled = true

[observability.logs]
enabled = true


# =========================================================
# 定时任务
# Cloudflare Cron 使用 UTC
# UTC 16:00 = 北京时间第二天 00:00
# =========================================================

[triggers]
crons = ["0 16 * * *"]


# =========================================================
# 自定义域名
# =========================================================

[[routes]]
pattern = "mail.chreey.us.kg"
zone_name = "chreey.us.kg"
custom_domain = true
